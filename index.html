<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09070d">
<meta name="description" content="自分だけのスノードームを飾りつけて、ふって、雪を降らせる 3D の Web アプリ">
<title>スノードーム工房</title>
<meta property="og:type" content="website">
<meta property="og:title" content="スノードーム工房">
<meta property="og:description" content="自分だけのスノードームを飾りつけて、ふって、雪を降らせる 3D の Web アプリ">
<meta property="og:url" content="https://tanuu5.github.io/snow-globe-atelier/">
<meta property="og:image" content="https://tanuu5.github.io/snow-globe-atelier/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='27' r='21' fill='%23cfe6ff' fill-opacity='.35' stroke='%23f3d08a' stroke-width='3'/%3E%3Cpath d='M32 11l9 22H23z' fill='%232e7a45'/%3E%3Crect x='12' y='47' width='40' height='11' rx='3' fill='%236b3f22'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --gold: #f3d08a;
    --gold-deep: #c08a3a;
    --ink: #f7efe2;
    --muted: rgba(247, 239, 226, .62);
    --line: rgba(255, 226, 180, .16);
    --panel: rgba(17, 12, 24, .62);
    --chip: rgba(255, 255, 255, .055);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #1d1428 0%, #09070d 62%);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; }

  /* ---------- 2:3 の箱 ---------- */
  #app {
    position: relative;
    width: min(100vw, 66.6667vh); height: min(100vh, 150vw);
    width: min(100vw, 66.6667dvh); height: min(100dvh, 150vw);
    overflow: hidden; container-type: size;
    background: #120c0a;
    border-radius: min(18px, 2.2vw);
    box-shadow: 0 30px 90px rgba(0, 0, 0, .65), 0 0 0 1px rgba(255, 230, 190, .07);
    isolation: isolate;
  }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(115% 80% at 50% 38%, transparent 52%, rgba(0, 0, 0, .5) 100%),
      linear-gradient(180deg, rgba(0, 0, 0, .35) 0%, transparent 16%);
  }
  .fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .32s ease; }
  .fade.on { opacity: .75; }

  /* ---------- ヘッダー ---------- */
  header.top {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 4.2cqw 5cqw 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .title .en {
    display: block; font-size: 2.15cqw; letter-spacing: .46em; color: rgba(243, 208, 138, .72);
    margin-bottom: .6cqw;
  }
  .title h1 {
    font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif; font-weight: 800;
    font-size: 7cqw; line-height: 1.1; letter-spacing: .04em;
    background: linear-gradient(180deg, #fff7df 0%, #f3d08a 48%, #b97f2c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 1.6cqw rgba(255, 186, 90, .35));
  }
  .count {
    text-align: center; padding: 1.5cqw 3cqw 1.7cqw; margin-top: .4cqw;
    border: 1px solid rgba(243, 208, 138, .35); border-radius: 3cqw;
    background: linear-gradient(180deg, rgba(40, 24, 18, .55), rgba(20, 12, 16, .35));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 0 3cqw rgba(255, 180, 90, .08) inset;
  }
  .count small { display: block; font-size: 2.3cqw; color: var(--muted); letter-spacing: .08em; }
  .count b {
    font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif; font-size: 6.2cqw; line-height: 1.05; color: var(--gold);
    text-shadow: 0 0 2cqw rgba(255, 190, 90, .45);
  }
  .count em { font-style: normal; font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif; font-weight: 600; font-size: 3.2cqw; margin-left: .5cqw; color: var(--ink); }
  .count.special b { font-size: 3.6cqw; line-height: 1.5; }

  /* ---------- ヒント・トースト ---------- */
  .hint {
    position: absolute; left: 50%; top: 27cqw; transform: translate(-50%, -50%);
    padding: 2.2cqw 4.2cqw; border-radius: 99px;
    background: rgba(12, 9, 18, .62); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 3.1cqw; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .6s ease;
  }
  .hint.on { opacity: 1; }
  .hint i { font-style: normal; color: var(--gold); }
  .toast {
    position: absolute; left: 50%; top: 20cqw; transform: translate(-50%, -1cqw);
    padding: 1.8cqw 4cqw; border-radius: 99px; font-size: 3cqw; white-space: nowrap;
    background: rgba(20, 14, 26, .78); border: 1px solid rgba(243, 208, 138, .35);
    opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 下のドック ---------- */
  .dock {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; pointer-events: none;
  }
  .actions {
    display: flex; justify-content: center; align-items: flex-end; gap: 9cqw;
    margin-bottom: -2.6cqw; position: relative; z-index: 2;
  }
  .fab {
    pointer-events: auto; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5cqw;
    border-radius: 50%;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .fab:active { transform: scale(.94); }
  .fab.small {
    width: 11.6cqw; height: 11.6cqw; margin-bottom: 3.4cqw;
    background: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, .22), rgba(255, 255, 255, .05) 60%), rgba(22, 16, 30, .7);
    border: 1px solid rgba(255, 230, 190, .22);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 1.4cqw 3cqw rgba(0, 0, 0, .35);
  }
  .fab.small svg { width: 4.6cqw; height: 4.6cqw; }
  .fab.small span { font-size: 1.85cqw; letter-spacing: -.03em; color: var(--muted); white-space: nowrap; }
  .fab.small.on { border-color: var(--gold); box-shadow: 0 0 3.5cqw rgba(255, 190, 90, .45), 0 1.4cqw 3cqw rgba(0, 0, 0, .35); }
  .fab.small.on svg { color: var(--gold); animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-.5cqw) rotate(-6deg); } }
  .fab.big {
    width: 17cqw; height: 17cqw;
    background:
      radial-gradient(circle at 34% 26%, rgba(255, 255, 255, .95) 0 3%, rgba(255, 255, 255, .35) 16%, transparent 42%),
      radial-gradient(circle at 50% 60%, #8fc4ff 0%, #3c6fc4 55%, #1b2f66 100%);
    border: 1.5px solid rgba(220, 238, 255, .7);
    box-shadow: 0 0 5cqw rgba(140, 190, 255, .45), 0 2cqw 4cqw rgba(0, 0, 0, .45), inset 0 -1.6cqw 3cqw rgba(10, 20, 60, .45);
    color: #fff;
  }
  .fab.big svg { width: 6.6cqw; height: 6.6cqw; filter: drop-shadow(0 0 1cqw rgba(255, 255, 255, .7)); }
  .fab.big span { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif; font-weight: 700; font-size: 3.3cqw; letter-spacing: .2em; margin-right: -.2em; text-shadow: 0 0 1.2cqw rgba(30, 60, 140, .9); }
  .fab.big::after {
    content: ""; position: absolute; inset: -1.6cqw; border-radius: 50%;
    border: 1px solid rgba(190, 220, 255, .55); opacity: 0; animation: ring 2.4s ease-out infinite;
  }
  .fab.big.tried::after { animation: none; }
  @keyframes ring { 0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(1.28); opacity: 0; } }

  .panel {
    pointer-events: auto;
    margin: 0 3cqw 3cqw; padding: 4.2cqw 2.2cqw 2.4cqw;
    border-radius: 5cqw;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    box-shadow: 0 2cqw 6cqw rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 240, 210, .08);
  }
  .tabs { display: flex; justify-content: space-between; padding: 0 .6cqw 1.4cqw; border-bottom: 1px solid var(--line); margin-bottom: 2cqw; }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: .7cqw;
    font-size: 2.5cqw; color: var(--muted); padding: .4cqw 0; position: relative;
    transition: color .2s ease;
  }
  .tab svg { width: 4.3cqw; height: 4.3cqw; }
  .tab.on { color: var(--gold); }
  .tab.on::after {
    content: ""; position: absolute; bottom: -1.6cqw; left: 50%; width: 7cqw; height: 2px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--gold), transparent); border-radius: 2px;
  }
  .panes { display: grid; grid-template-columns: minmax(0, 1fr); }
  .pane { grid-area: 1 / 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1.8cqw; visibility: hidden; opacity: 0; transition: opacity .2s ease; }
  .pane.on { visibility: visible; opacity: 1; }
  .row { display: flex; align-items: center; gap: 1.5cqw; overflow-x: auto; scrollbar-width: none; padding: .4cqw .4cqw; }
  .row::-webkit-scrollbar { display: none; }
  .row.fit { justify-content: space-between; gap: 1.1cqw; }
  .lbl { flex: none; font-size: 2.5cqw; color: var(--muted); letter-spacing: .08em; padding: 0 1.4cqw 0 1cqw; }
  .chip {
    flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 1cqw;
    height: 8.4cqw; padding: 0 2.1cqw; border-radius: 99px;
    border: 1px solid rgba(255, 230, 190, .16); background: var(--chip);
    font-size: 2.72cqw; white-space: nowrap;
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .chip:active { transform: scale(.96); }
  .chip.on { border-color: var(--gold); background: rgba(243, 208, 138, .15); color: #fff4da; box-shadow: inset 0 0 2.4cqw rgba(243, 190, 100, .22); }
  .chip .dot { width: 2.3cqw; height: 2.3cqw; border-radius: 50%; flex: none; box-shadow: 0 0 1.4cqw currentColor; }
  .chip.act { background: rgba(255, 255, 255, .04); }
  .chip.act svg { width: 3.6cqw; height: 3.6cqw; }
  .chip.danger.armed { border-color: #ff8a8a; color: #ffd0d0; background: rgba(255, 90, 90, .14); }

  .orn {
    flex: none; width: 9.8cqw; height: 11.6cqw; border-radius: 3cqw;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1cqw;
    border: 1px solid rgba(255, 230, 190, .12); background: var(--chip);
    font-size: 2.1cqw; color: var(--muted); white-space: nowrap;
    transition: background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .orn:active { transform: scale(.94); }
  .orn.on { border-color: var(--gold); background: rgba(243, 208, 138, .14); color: #fff4da; box-shadow: inset 0 0 2.4cqw rgba(243, 190, 100, .2); }
  .orn .ic { width: 6.2cqw; height: 6.2cqw; display: grid; place-items: center; }
  .orn .ic svg { width: 100%; height: 100%; }
  .ball {
    width: 5.2cqw; height: 5.2cqw; border-radius: 50%; position: relative; margin-top: .9cqw;
    background: radial-gradient(circle at 33% 30%, #fff 0 5%, var(--a) 16%, var(--b) 68%, #120306 100%);
    box-shadow: 0 .6cqw 1.2cqw rgba(0, 0, 0, .4);
  }
  .ball::before {
    content: ""; position: absolute; left: 50%; top: -1cqw; width: 1.6cqw; height: 1.2cqw; transform: translateX(-50%);
    border-radius: .3cqw; background: linear-gradient(90deg, #8a6526, #f6dc98, #8a6526);
  }

  .msg-row { display: flex; gap: 1.8cqw; padding: .4cqw; }
  .msg-row input {
    flex: 1; min-width: 0; height: 8.6cqw; padding: 0 3.4cqw; border-radius: 99px;
    border: 1px solid rgba(255, 230, 190, .22); background: rgba(0, 0, 0, .25); color: var(--ink);
    font: inherit; font-size: 3.1cqw; outline: none; -webkit-user-select: text; user-select: text;
  }
  .msg-row input:focus { border-color: var(--gold); }
  .chip.primary { border-color: rgba(243, 208, 138, .6); background: linear-gradient(180deg, rgba(243, 208, 138, .3), rgba(192, 138, 58, .25)); color: #fff4da; }

  /* ---------- 読み込み ---------- */
  #loading {
    position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqw;
    background: radial-gradient(80% 60% at 50% 45%, #22162a, #0b0810);
    transition: opacity .8s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading svg { width: 14cqw; height: 14cqw; color: #dbe9ff; animation: spin 6s linear infinite; filter: drop-shadow(0 0 2cqw rgba(160, 200, 255, .6)); }
  #loading p { font-size: 3.2cqw; color: var(--muted); letter-spacing: .12em; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main id="app">
  <canvas id="c" tabindex="0" aria-label="スノードーム（ドラッグで回す、タップで飾る）"></canvas>
  <div class="vignette"></div>
  <div class="fade" id="fade"></div>

  <header class="top">
    <div class="title">
      <span class="en">SNOW GLOBE ATELIER</span>
      <h1>スノードーム工房</h1>
    </div>
    <div class="count" id="count"><small>クリスマスまで</small><b>--</b><em>日</em></div>
  </header>

  <div class="hint" id="hint"><i>ツリーをタップ</i>でかざりつけ ・ <i>ドラッグ</i>でくるり</div>
  <div class="toast" id="toast"></div>

  <div class="dock" id="dock">
    <div class="actions" id="actions">
      <button class="fab small" id="bMusic" aria-label="オルゴール">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.5l11-2.2v12.4"/><circle cx="6.4" cy="18" r="2.7"/><circle cx="17.4" cy="15.7" r="2.7"/></svg>
        <span>オルゴール</span>
      </button>
      <button class="fab big" id="bShake" aria-label="ふる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5"/><path d="M9.6 3.9 12 5.9l2.4-2M9.6 20.1 12 18.1l2.4 2M4.3 10.3l3-.95-.6-3.05M19.7 13.7l-3 .95.6 3.05M4.3 13.7l3 .95-.6 3.05M19.7 10.3l-3-.95.6-3.05"/></svg>
        <span>ふる</span>
      </button>
      <button class="fab small" id="bSnap" aria-label="画像を保存">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 7.5h3l1.8-2.7h6.4L17 7.5h3a1.2 1.2 0 0 1 1.2 1.2v9.6a1.2 1.2 0 0 1-1.2 1.2H4a1.2 1.2 0 0 1-1.2-1.2V8.7A1.2 1.2 0 0 1 4 7.5z"/><circle cx="12" cy="13.2" r="3.6"/></svg>
        <span>ほぞん</span>
      </button>
    </div>

    <nav class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="deco" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="14.2" r="6.8"/><path d="M10.2 7.6V5.6h3.6v2M12 5.6V3.2"/><path d="M5.6 12.4c4.2 2 8.6 2 12.8 0"/></svg>
          <span>かざる</span>
        </button>
        <button class="tab" data-tab="light" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 17.6h5.6M10.2 20.6h3.6M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2v.6h5.2v-.6c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
          <span>ライト</span>
        </button>
        <button class="tab" data-tab="scene" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 20.5 9 12.2l4 5 2.8-3.2 5.4 6.5z"/><path d="M17.2 3.4a3.6 3.6 0 1 0 3.9 4.8 3.1 3.1 0 0 1-3.9-4.8z"/></svg>
          <span>けしき</span>
        </button>
        <button class="tab" data-tab="music" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.5l11-2.2v12.4"/><circle cx="6.4" cy="18" r="2.7"/><circle cx="17.4" cy="15.7" r="2.7"/></svg>
          <span>おんがく</span>
        </button>
        <button class="tab" data-tab="msg" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5.2" width="18" height="13.6" rx="2"/><path d="m3.6 6.6 8.4 6.2 8.4-6.2"/></svg>
          <span>メッセージ</span>
        </button>
      </div>

      <div class="panes">
        <section class="pane on" data-pane="deco">
          <div class="row fit" data-group="tool">
            <button class="orn on" data-v="red"><span class="ic"><i class="ball" style="--a:#ff6e7f;--b:#9e0b22"></i></span>あか</button>
            <button class="orn" data-v="gold"><span class="ic"><i class="ball" style="--a:#ffe2a0;--b:#a8741f"></i></span>きん</button>
            <button class="orn" data-v="blue"><span class="ic"><i class="ball" style="--a:#7fa6ff;--b:#13328c"></i></span>あお</button>
            <button class="orn" data-v="silver"><span class="ic"><i class="ball" style="--a:#ffffff;--b:#8a96a3"></i></span>ぎん</button>

const $ = (s) => document.querySelector(s);
const app = $('#app'), canvas = $('#c');

// 寸法（ドーム内のローカル座標。単位はおおよそ 10cm）
const C_Y = 1.15;          // ガラス球の中心の高さ
const R_GLASS = 1.0;

const G_BASE = 0.50, G_TOP = 0.585, G_R = 0.758;

function groundY(x, z) {
  const r = Math.hypot(x, z), k = Math.min(1, r / G_R);

  return dome + n * w;
}

// =====================================================================

let renderer;
try {

function canvasTex(w, h, draw, srgb = true) {

}

const woodTex = canvasTex(1024, 256, (g, w, h) => {
  const img = g.createImageData(w, h), d = img.data;

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

    const ring = 0.5 + 0.5 * Math.sin((y + warp) * 0.42);
    const fine = 0.5 + 0.5 * Math.sin((y + warp * 1.3) * 1.9 + Math.sin(u * 40) * 0.5);
    const k = clamp(Math.pow(ring, 2.4) * 0.7 + fine * 0.18 + Math.random() * 0.08, 0, 1);
    const a = k < 0.5 ? dark : mid, b = k < 0.5 ? mid : light, t = k < 0.5 ? k * 2 : (k - 0.5) * 2;

  }

});

// 台座のプレート（メッセージ）
const plateCanvas = document.createElement('canvas'); plateCanvas.width = 1024; plateCanvas.height = 144;

const bgMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,

    float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }

      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const bg = new THREE.Mesh(new THREE.SphereGeometry(60, 48, 24), bgMat);
bg.renderOrder = -10; bg.raycast = () => {};
scene.add(bg);

const tableMat = new THREE.MeshStandardMaterial({ color: '#2a1a12', roughness: 0.42, metalness: 0.0 });
const table = new THREE.Mesh(new THREE.CircleGeometry(40, 96), tableMat);
table.rotation.x = -Math.PI / 2; table.receiveShadow = true; table.raycast = () => {};

// テーブルの上の小物：きらきらの星と、ころがったオーナメント
function starShape(R1, R2, n = 5) {
  const s = new THREE.Shape();
  for (let i = 0; i < n * 2; i++) {
    const a = (i / (n * 2)) * TAU + Math.PI / 2, r = i % 2 ? R2 : R1;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
  }
  s.closePath(); return s;
}
const goldMat = new THREE.MeshStandardMaterial({ color: '#e5bb6a', metalness: 1, roughness: 0.26 });
{
  const g = new THREE.ExtrudeGeometry(starShape(0.035, 0.015), { depth: 0.004, bevelEnabled: false });

  const silver = new THREE.MeshStandardMaterial({ color: '#dfe6ee', metalness: 1, roughness: 0.2 });

    { c: '#b0102a', m: 0.45, r: 0.15, p: [-1.32, 0.95] },

const groundMat = new THREE.MeshStandardMaterial({ color: '#e4ebf3', roughness: 0.88, metalness: 0 });
groundMat.onBeforeCompile = (sh) => {
  sh.uniforms.uTime = U.time;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vSpk;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvSpk = position;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      varying vec3 vSpk; uniform float uTime;
      float h31(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      { vec3 cell = floor(vSpk * 150.0); float r = h31(cell); float tw = 0.5 + 0.5 * sin(uTime * 2.6 + r * 70.0);
        totalEmissiveRadiance += vec3(1.0, 0.97, 0.9) * step(0.982, r) * tw * tw * 2.2; }`);
};
const ground = (() => {
  const pts = [];
  const N = 44;
  for (let i = 0; i <= N; i++) {
    const r = (i / N) * 0.752, k = r / G_R;
    pts.push(new THREE.Vector2(Math.max(r, 1e-4), G_BASE + (G_TOP - G_BASE) * Math.cos(k * Math.PI / 2)));
  }
  for (let y = G_BASE - 0.01; y >= BASE_TOP - 0.005; y -= 0.015) {
    pts.push(new THREE.Vector2(Math.sqrt(Math.max(0, R_GLASS * R_GLASS - (y - C_Y) ** 2)) - 0.006, y));
  }
  let g = new THREE.LatheGeometry(pts, 160);
  g.deleteAttribute('uv'); g.deleteAttribute('normal');
  g = mergeVertices(g, 1e-5);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    if (Math.hypot(x, z) < 0.745) p.setY(i, groundY(x, z));
  }
  g.computeVertexNormals();
  // LatheGeometry は外向き＝下向きの面になるので、上向きに裏返す
  const idx = g.index.array;
  for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; }
  const nr = g.attributes.normal;
  for (let i = 0; i < nr.count; i++) nr.setXYZ(i, -nr.getX(i), -nr.getY(i), -nr.getZ(i));
  const m = new THREE.Mesh(g, groundMat);
  m.receiveShadow = true; m.userData.role = 'ground';
  return m;
})();

const TIERS = [[0.10, 0.40, 0.40, 13], [0.30, 0.36, 0.33, 11], [0.49, 0.32, 0.25, 9], [0.66, 0.31, 0.17, 7]];
const TREE_TOP = 0.97;
function envR(y) {          // ツリーのその高さでの外形の半径
  let m = 0;
  for (const [y0, h, r] of TIERS) if (y >= y0 && y <= y0 + h) m = Math.max(m, r * (1 - (y - y0) / h));
  return m;
}
function tierGeo(r, h, pts, seed, snowAmt = 0.55, palette = null) {
  let g = new THREE.ConeGeometry(r, h, 150, 14, true);
  g.deleteAttribute('uv'); g.deleteAttribute('normal');
  g = mergeVertices(g, 1e-6);
  g.translate(0, h / 2, 0);
  const p = g.attributes.position, n = p.count;
  const colors = new Float32Array(n * 3);
  const cDeep = new THREE.Color(palette?.[0] ?? '#0c3a20'), cLeaf = new THREE.Color(palette?.[1] ?? '#2d7a44'),
        cTip = new THREE.Color(palette?.[2] ?? '#5aa564'), cSnow = new THREE.Color('#eef4f8');
  const c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = clamp(y / h, 0, 1);
    const a = Math.atan2(x, z);
    const ph = (a / TAU + 0.5) * pts + seed;
    const f = ph - Math.floor(ph);
    const tip = Math.pow(Math.sin(f * Math.PI), 1.6);
    const rim = Math.pow(1 - t, 2.4);
    const needle = Math.sin(a * 61 + y * 90 + seed * 5) * 0.5 + Math.sin(a * 97 - y * 140) * 0.5;
    const m = 1 + 0.08 * (1 - t) * (tip - 0.5) + 0.15 * rim * (tip - 0.25) + 0.02 * (1 - t) * needle;
    x *= m; z *= m;
    y += -0.05 * rim * tip + 0.016 * rim * (1 - tip);
    p.setXYZ(i, x, y, z);
    const shade = clamp(0.22 + 0.58 * tip * (1 - t * 0.55) + 0.12 * needle + (hash1(i + seed * 99) - 0.5) * 0.16, 0, 1);
    c.copy(cDeep).lerp(cLeaf, shade);
    if (tip > 0.75) c.lerp(cTip, (tip - 0.75) * 2.4 * (0.3 + rim));
    const sn = rim * Math.pow(tip, 3) * (0.55 + 0.45 * Math.sin(a * 13 + seed * 3)) * snowAmt + (snowAmt > 0.8 ? 0.25 * (1 - t) * tip : 0);
    c.lerp(cSnow, clamp(sn, 0, 0.85));
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  g.computeVertexNormals();
  const nr = g.attributes.normal, v = new THREE.Vector3();   // 葉のざらつき
  for (let i = 0; i < nr.count; i++) {
    v.set(nr.getX(i) + (hash1(i * 3.1) - 0.5) * 0.5, nr.getY(i) + (hash1(i * 5.7) - 0.5) * 0.5, nr.getZ(i) + (hash1(i * 7.3) - 0.5) * 0.5).normalize();
    nr.setXYZ(i, v.x, v.y, v.z);
  }
  return g;
}

function spiralPoints(y0, y1, turns, phase, radOff, sagAmp = 0, sagPer = 3) {
  const P = [];
  const S = 3000;
  for (let i = 0; i <= S; i++) {
    const u = i / S;
    let y = y0 + (y1 - y0) * u;
    const ang = u * TAU * turns + phase;
    if (sagAmp) { const fr = ((ang * sagPer) / TAU) % 1; y -= sagAmp * Math.sin(fr * Math.PI); }
    const r = envR(y) + radOff;
    P.push(new THREE.Vector3(Math.sin(ang) * r, y, Math.cos(ang) * r));
  }
  return P;
}
function resample(P, count) {
  const L = [0];
  for (let i = 1; i < P.length; i++) L.push(L[i - 1] + P[i].distanceTo(P[i - 1]));
  const out = [], total = L[L.length - 1];
  let j = 0;
  for (let k = 0; k < count; k++) {
    const s = ((k + 0.5) / count) * total;
    while (j < L.length - 2 && L[j + 1] < s) j++;
    const t = (s - L[j]) / Math.max(1e-6, L[j + 1] - L[j]);
    out.push(P[j].clone().lerp(P[j + 1], t));
  }
  return out;
}

class CandyCurve extends THREE.Curve {
  getPoint(t, target = new THREE.Vector3()) {
    const L1 = 0.07, rr = 0.016, L2 = Math.PI * rr, L3 = 0.012, L = L1 + L2 + L3;
    let s = t * L;
    if (s <= L1) return target.set(0, -L1 + s, 0);
    s -= L1;
    if (s <= L2) { const a = Math.PI - s / rr; return target.set(rr + Math.cos(a) * rr, Math.sin(a) * rr, 0); }
    s -= L2; return target.set(2 * rr, -s, 0);
  }
}

  for (let k = 0; k < 6; k++) for (const s of [-1, 1]) {

}

function makeOrnament(o, bornAt) {
  const pivot = new THREE.Group(), body = new THREE.Group();
  pivot.add(body);
  const def = ORN[o.type];
  const add = (geo, mat, y = 0) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; m.userData.role = 'orn'; body.add(m); return m; };
  if (def.kind === 'ball') {
    add(OG.ball, OM[o.type]); add(OG.cap, goldMat, 0.035); add(OG.loop, goldMat, 0.045);
  } else if (def.kind === 'bell') {
    add(OG.bell, OM.bell); add(OG.clap, goldMat, -0.024); add(OG.loop, goldMat, 0.047);
  } else if (def.kind === 'candy') {
    add(OG.candy, OM.candy);
  } else {
    add(OG.flake, OM.flake).rotation.z = hash1(o.p[0] * 991) * 1.0;
  }
  body.position.y = -def.hang;
  pivot.position.set(o.p[0], o.p[1] + def.hang, o.p[2]);
  pivot.rotation.y = o.a;

function snowImpulse(s) {
  agitation = Math.min(1.7, agitation + s);
  for (let i = 0; i < SNOW_N; i++) {
    const j = i * 3;
    if (sRest[i]) {
      sRest[i] = 0;
      sv[j] = (Math.random() - 0.5) * 1.1 * s; sv[j + 1] = (0.45 + Math.random() * 1.25) * s; sv[j + 2] = (Math.random() - 0.5) * 1.1 * s;
    } else {
      sv[j] += (Math.random() - 0.5) * 0.8 * s; sv[j + 1] += Math.random() * 0.5 * s; sv[j + 2] += (Math.random() - 0.5) * 0.8 * s;
    }
  }
}
function localPuff(p, s, radius = 0.25) {   // ある点のまわりだけ舞い上げる
  for (let i = 0; i < SNOW_N; i++) {
    const j = i * 3;
    const dx = sp[j] - p.x, dy = sp[j + 1] - p.y, dz = sp[j + 2] - p.z;
    const d = Math.hypot(dx, dy, dz);
    if (d > radius) continue;
    const k = (1 - d / radius) * s;
    sRest[i] = 0;
    sv[j] += (dx / (d + 1e-3)) * k * 0.6 + (Math.random() - 0.5) * k * 0.4;
    sv[j + 1] += (0.4 + Math.random() * 0.8) * k;
    sv[j + 2] += (dz / (d + 1e-3)) * k * 0.6 + (Math.random() - 0.5) * k * 0.4;

function stepSnow(dt, t) {

    if (sRest[i]) continue;
    const j = i * 3, sd = sSeed[i];
    let x = sp[j], y = sp[j + 1], z = sp[j + 2], vx = sv[j], vy = sv[j + 1], vz = sv[j + 2];
    if (ag > 0.01) {
      const rr = Math.hypot(x, z);
      const ux = -z * 1.8 + Math.sin(y * 6.0 + t * 1.7 + sd * 10) * 0.5;
      const uz = x * 1.8 + Math.cos(y * 5.0 - t * 1.3 + sd * 7) * 0.5;
      const uy = (0.5 - rr) * 1.5 + Math.sin(x * 5 + t * 2 + sd * 6) * 0.3;
      vx += (ux * ag - vx) * kFlow; vy += (uy * ag - vy) * kFlow; vz += (uz * ag - vz) * kFlow;
    }
    vy -= g * dt;
    vx *= ed; vy *= ed; vz *= ed;
    x += (vx + Math.sin(t * 1.3 + sd * 20) * 0.014) * dt;
    y += vy * dt;
    z += (vz + Math.cos(t * 1.1 + sd * 13) * 0.014) * dt;
    const dy = y - C_Y, d2 = x * x + dy * dy + z * z;
    if (d2 > R2) {
      const d = Math.sqrt(d2), nx = x / d, ny = dy / d, nz = z / d;
      x = nx * R_IN; y = C_Y + ny * R_IN; z = nz * R_IN;
      const vn = vx * nx + vy * ny + vz * nz;
      if (vn > 0) { vx -= 1.5 * vn * nx; vy -= 1.5 * vn * ny; vz -= 1.5 * vn * nz; }
    }
    const gy = groundY(x, z) + 0.005;
    if (y < gy) {
      y = gy;
      if (ag < 0.12 && vy < 0.06) { sRest[i] = 1; vx = vy = vz = 0; }
      else vy = Math.abs(vy) * 0.35 + ag * 0.25;

  agitation *= Math.exp(-0.55 * dt);

}

let simT = 0;
const ray = new THREE.Raycaster();
const r4 = (x) => Math.round(x * 10000) / 10000;

function ornamentFromHit(hit, type) {
  const p = tree.worldToLocal(hit.point.clone());
  const n = hit.face.normal.clone();
  const radial = new THREE.Vector3(p.x, 0, p.z);
  if (radial.lengthSq() < 1e-8) radial.set(0, 0, 1);
  radial.normalize();
  if (n.dot(radial) < 0) n.negate();
  n.lerp(radial, 0.35).normalize();
  p.addScaledVector(n, ORN[type].off);
  return { type, p: [r4(p.x), r4(p.y), r4(p.z)], a: r4(Math.atan2(radial.x, radial.z)) };
}
function tooClose(p, min) {
  for (const o of S.orns) if (Math.hypot(o.p[0] - p[0], o.p[1] - p[1], o.p[2] - p[2]) < min) return true;
  return false;
}
function addOrnament(o, animate = true, delay = 0) {
  S.orns.push(o);
  makeOrnament(o, animate ? simT + delay : -100);
  if (animate) {
    SFX.ting(delay);
    setTimeout(() => sparkle(v3.set(o.p[0], o.p[1], o.p[2]).add(tree.position), 10, '#ffe2a0', 0.25), delay * 1000);
  }
}

  const i = S.orns.indexOf(o);
  if (i >= 0) S.orns.splice(i, 1);
  ornGroup.remove(pivot);
  sparkle(pivot.position.clone().add(tree.position), 14, '#cfe6ff', 0.3);
  SFX.pop();
}
const TYPE_WEIGHTS = [['red', 4], ['gold', 4], ['blue', 2], ['silver', 3], ['bell', 2], ['candy', 2], ['flake', 2]];
function pickType(rand) {
  const total = TYPE_WEIGHTS.reduce((a, [, w]) => a + w, 0);
  let x = rand() * total;
  for (const [t, w] of TYPE_WEIGHTS) { if ((x -= w) < 0) return t; }
  return 'red';
}
function autoDecorate(count, animate = true, rand = Math.random) {
  scene.updateMatrixWorld(true);
  const q = new THREE.Quaternion(); tree.getWorldQuaternion(q);
  let placed = 0;
  for (let tries = 0; placed < count && tries < count * 40 && S.orns.length < MAX_ORN; tries++) {
    const y = 0.15 + rand() * 0.72, e = envR(y);
    if (e < 0.04) continue;
    const ang = rand() * TAU;
    v3.set(Math.sin(ang) * (e + 0.3), y + 0.06, Math.cos(ang) * (e + 0.3));
    tree.localToWorld(v3);
    v3b.set(-Math.sin(ang), -0.2, -Math.cos(ang)).normalize().applyQuaternion(q);
    ray.set(v3, v3b);
    const h = ray.intersectObjects(tiers, false)[0];

let shakeT = -1, shakeImp = 0;

  ensureAudio();
  if (shakeT >= 0 && shakeT < 0.75) return;
  shakeT = 0; shakeImp = 0;
  SFX.shake();

  hideHint();
}
function stepShake(dt) {
  if (shakeT < 0) { globe.position.y = 0; globe.rotation.set(0, 0, 0); return; }
  shakeT += dt;
  const T = 1.15, k = Math.min(1, shakeT / T), env = Math.sin(k * Math.PI);
  globe.position.y = Math.pow(env, 0.7) * 0.2;
  globe.rotation.z = Math.sin(shakeT * 25) * 0.075 * env;
  globe.rotation.x = Math.cos(shakeT * 19) * 0.045 * env;
  globe.position.x = Math.sin(shakeT * 25 + 1) * 0.03 * env;
  const marks = [0.18, 0.36, 0.54, 0.72];
  while (shakeImp < marks.length && shakeT >= marks[shakeImp]) { snowImpulse(shakeImp === 0 ? 0.75 : 0.45); shakeImp++; }
  if (shakeT >= T) { shakeT = -1; globe.position.set(0, 0, 0); globe.rotation.set(0, 0, 0); SFX.thunk(); }
}

  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickRoots, true);
  const hit = hits[0];
  const info = hit && roleOf(hit.object);
  const toDome = (p) => dome.worldToLocal(p.clone());
  hideHint();
  if (!info) {
    const g = ray.intersectObject(glass, false)[0];
    if (g) { SFX.glass(); localPuff(toDome(g.point), 0.35, 0.3); }
    return;
  }
  const { role } = info;
  if (S.tool === 'erase') {
    if (role === 'orn') removeOrnament(findPivot(hit.object));
    else if (role === 'tree') toast('はずしたい飾りをタップしてください');
    save();
    return;
  }
  if (role === 'tree') {
    if (S.orns.length >= MAX_ORN) { toast('これ以上は かざれません'); return; }
    const o = ornamentFromHit(hit, S.tool);

  } else if (role === 'house') {

  } else if (role === 'snowman') {

function fitCamera() {

}
function resizeTo(w, h) {
  const pr = renderer.getPixelRatio();
  renderer.setSize(w, h, false);
  composer.setPixelRatio(pr); composer.setSize(w, h);
  camera.aspect = w / h;
  camera.setViewOffset(w, h, 0, view.shift * h, w, h);
  camera.updateProjectionMatrix();
  const sc = h * pr * 0.5 * camera.projectionMatrix.elements[5];
  snowMat.uniforms.uScale.value = sc; spkMat.uniforms.uScale.value = sc;
}
function onResize() { resizeTo(app.clientWidth, app.clientHeight); }
new ResizeObserver(onResize).observe(app);

let idle = 0;
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId }; idle = 0; controls.autoRotate = false; ensureAudio(); });
canvas.addEventListener('pointerup', (e) => {
  if (!down || down.id !== e.pointerId) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
  if (moved < 8 && dt < 450) tapAt(e.clientX, e.clientY);
  down = null;
});
canvas.addEventListener('wheel', () => { idle = 0; controls.autoRotate = false; }, { passive: true });
document.addEventListener('gesturestart', (e) => e.preventDefault());

// 端末をふる（許可の要らない端末だけ）
if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission !== 'function') {
  let lastMotion = 0;
  window.addEventListener('devicemotion', (e) => {
    const a = e.acceleration;
    if (!a || a.x == null) return;
    const m = Math.hypot(a.x, a.y, a.z), now = performance.now();
    if (m > 16 && now - lastMotion > 1500) { lastMotion = now; shake(); }
  });
}

// =====================================================================
//  画面（UI）
// =====================================================================
const hintEl = $('#hint'), toastEl = $('#toast');
let hintShown = false;
function hideHint() { hintEl.classList.remove('on'); }
let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 2200);
}
function setGroup(group, v) {
  document.querySelectorAll(`[data-group="${group}"] [data-v]`).forEach((b) => b.classList.toggle('on', b.dataset.v === v));
}
function fadeSwap(fn) {
  const f = $('#fade');
  f.classList.add('on');
  setTimeout(() => { fn(); requestAnimationFrame(() => f.classList.remove('on')); }, 330);
}
function applySnow(name) {
  snowCfg = SNOW_TYPES[name] || SNOW_TYPES.snow;
  const u = snowMat.uniforms;
  u.uColor.value.set(snowCfg.color); u.uColor2.value.set(snowCfg.color2);
  u.uSparkle.value = snowCfg.sparkle; u.uShape.value = snowCfg.shape; u.uSizeMul.value = snowCfg.size; u.uAlpha.value = snowCfg.alpha;
  snowMat.blending = snowCfg.add ? THREE.AdditiveBlending : THREE.NormalBlending;
  snowMat.needsUpdate = true;
}
const HANDLERS = {
  tool(v) { S.tool = v; if (v === 'erase') toast('はずしたい飾りをタップしてください'); },
  lights(v) { S.lights = v; applyLights(v); },
  anim(v) { S.anim = v; },
  mood(v) { S.mood = v; fadeSwap(() => applyMood(v)); },
  snow(v) { S.snow = v; applySnow(v); snowImpulse(0.5); },
  song(v) { S.song = v; startMusic(); },
  sfx(v) { S.sfx = v; },
  msgPreset(v) { setMessage(v); },
};
document.querySelectorAll('[data-group]').forEach((row) => {
  const group = row.dataset.group;
  row.addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]');
    if (!b) return;
    ensureAudio();
    if (group !== 'msgPreset') setGroup(group, b.dataset.v);
    HANDLERS[group](b.dataset.v);
    SFX.click();
    save();
  });
});
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('on', p.dataset.pane === t.dataset.tab));
  ensureAudio(); SFX.click();
}));
let clearArmed = 0;
document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
  ensureAudio();
  const act = b.dataset.act;
  if (act === 'auto') {
    if (S.orns.length >= MAX_ORN) { toast('これ以上は かざれません'); return; }
    const n = autoDecorate(Math.min(12, MAX_ORN - S.orns.length));
    if (!n) toast('すきまが見つかりませんでした');
  } else if (act === 'undo') {
    const o = S.orns[S.orns.length - 1];
    if (!o) { toast('飾りはまだありません'); return; }
    const pv = ornGroup.children.find((c) => c.userData.orn === o);
    if (pv) removeOrnament(pv);
  } else if (act === 'clear') {
    if (!S.orns.length) { toast('飾りはまだありません'); return; }
    if (!clearArmed) {
      clearArmed = setTimeout(() => { clearArmed = 0; b.classList.remove('armed'); }, 2600);
      b.classList.add('armed'); toast('もう一度おすと、ぜんぶ外します');
      return;
    }
    clearTimeout(clearArmed); clearArmed = 0; b.classList.remove('armed');
    [...ornGroup.children].forEach((pv, i) => setTimeout(() => { if (pv.parent) removeOrnament(pv); }, i * 25));
  }
  save();
}));
function setMessage(text) {
  S.message = (text || '').slice(0, 20);
  $('#msgInput').value = S.message;
  drawPlate(S.message);
  sparkle(v3.set(0, 0.19, 0.95), 24, '#ffe2a0', 0.4);
  save();
}
$('#msgApply').addEventListener('click', () => { ensureAudio(); setMessage($('#msgInput').value); SFX.chime(); $('#msgInput').blur(); });
$('#msgInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('#msgApply').click(); } });
$('#bShake').addEventListener('click', shake);
$('#bMusic').addEventListener('click', () => { ensureAudio(); music.playing ? stopMusic() : startMusic(); });
$('#bSnap').addEventListener('click', () => { ensureAudio(); saveImage(); });
document.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement) return;
  if (e.code === 'Space') { e.preventDefault(); shake(); }
  else if (e.code === 'KeyM') { ensureAudio(); music.playing ? stopMusic() : startMusic(); }
});
document.addEventListener('visibilitychange', () => {
  if (!actx) return;
  if (document.hidden) actx.suspend(); else actx.resume();
});

// クリスマスまでの日数
function updateCountdown() {
  const el = $('#count'), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let xmas = new Date(now.getFullYear(), 11, 25);
  if (today > xmas) xmas = new Date(now.getFullYear() + 1, 11, 25);
  const days = Math.round((xmas - today) / 86400000);
  if (days === 0) { el.classList.add('special'); el.innerHTML = '<small>きょうは</small><b>メリークリスマス</b>'; }
  else if (days === 1) { el.classList.add('special'); el.innerHTML = '<small>こんやは</small><b>クリスマス・イブ</b>'; }
  else { el.classList.remove('special'); el.innerHTML = `<small>クリスマスまで</small><b>${days}</b><em>日</em>`; }
}

// 画像の保存
function saveImage() {
  const W = 1200, H = 1800, cw = app.clientWidth, ch = app.clientHeight;
  // 画面では UI を避けて上に寄せているので、保存するときだけ中央に寄せて少し大きく写す
  const prevFov = camera.fov, prevShift = view.shift, prevPR = renderer.getPixelRatio(), k = 1.28;
  const f0 = view.centerY + view.shift;
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(prevFov / 2)) / k));
  view.shift = 0.5 + (f0 - 0.5) * k - 0.46;
  renderer.setPixelRatio(1); resizeTo(W, H); render();
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const g = out.getContext('2d');
  g.drawImage(renderer.domElement, 0, 0);
  camera.fov = prevFov; view.shift = prevShift;
  renderer.setPixelRatio(prevPR); resizeTo(cw, ch); render();
  const vg = g.createRadialGradient(W / 2, H * 0.42, H * 0.3, W / 2, H * 0.42, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const d = new Date(), stamp = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  g.textAlign = 'center'; g.fillStyle = 'rgba(243,208,138,.85)';
  g.font = '500 30px "Shippori Mincho B1", "Hiragino Mincho ProN", serif'; g.fillText('SNOW GLOBE ATELIER', W / 2, H - 92);
  g.font = '500 24px "Zen Maru Gothic", sans-serif'; g.fillStyle = 'rgba(247,239,226,.6)'; g.fillText(stamp, W / 2, H - 52);
  const a = document.createElement('a');
  a.href = out.toDataURL('image/png');
  a.download = `snowglobe-${stamp.replaceAll('.', '')}.png`;
  document.body.appendChild(a); a.click(); a.remove();
  sparkle(v3.set(0, C_Y + 0.4, 0.6), 30, '#ffffff', 0.5);
  toast('画像を保存しました');
}

// =====================================================================
//  時間を進める（実時間のループと __dev.advance() で同じ関数）
// =====================================================================
const easeOutBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function step(dt) {
  simT += dt; U.time.value = simT;
  idle += dt;
  controls.autoRotate = !music.playing && idle > 12;
  controls.update(dt);
  stepShake(dt);
  if (music.playing) dome.rotation.y += dt * 0.22;
  stepSnow(dt, simT);
  stepSparkle(dt);
  stepBulbs(simT);
  // 星
  const sg = starG.userData;
  sg.spin = Math.max(0, (sg.spin || 0) - dt * 0.8);
  starG.rotation.y += dt * (0.35 + sg.spin * 9);
  sg.glow.material.opacity = 0.75 + 0.2 * Math.sin(simT * 2.1);
  sg.glow.scale.setScalar(0.4 + 0.05 * Math.sin(simT * 1.7) + sg.spin * 0.25);
  // オーナメント
  const sway = Math.min(1, agitation * 0.9);
  for (const pv of ornGroup.children) {
    const u = pv.userData, k = clamp((simT - u.born) / 0.45, 0, 1);
    pv.scale.setScalar(k <= 0 ? 0.0001 : easeOutBack(k));
    u.jig = Math.max(0, u.jig - dt * 1.4);
    const amp = 0.05 + sway * 0.35 + u.jig * 0.5;
    pv.rotation.z = Math.sin(simT * 4.2 + u.phase) * amp * (0.3 + sway + u.jig);
    pv.rotation.x = Math.cos(simT * 3.4 + u.phase) * amp * 0.5 * (sway + u.jig);
  }
  // 雪だるまとプレゼントがはねる
  for (const g of [snowman, ...presents]) {
    const u = g.userData;
    if (u.baseY === undefined) u.baseY = g.position.y;
    u.hop = Math.max(0, (u.hop || 0) - dt * 2.2);
    const h = u.hop > 0 ? Math.abs(Math.sin((1 - u.hop) * Math.PI * 2)) * u.hop * 0.06 : 0;
    g.position.y = u.baseY + h;
  }
}
function render() { composer.render(); }

// =====================================================================
//  はじめる
// =====================================================================
for (const [g, v] of [['tool', S.tool], ['lights', S.lights], ['anim', S.anim], ['mood', S.mood], ['snow', S.snow], ['song', S.song], ['sfx', S.sfx]]) setGroup(g, v);
$('#msgInput').value = S.message;
applyMood(S.mood);
applyLights(S.lights);
applySnow(S.snow);
updateCountdown();
try { await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2500))]); } catch { /* フォントが読めなくても続ける */ }
drawPlate(S.message);
fitCamera();
onResize();
controls.update();
scene.updateMatrixWorld(true);
if (loaded) S.orns.splice(0).forEach((o) => addOrnament(o, false));
else autoDecorate(18, false, mulberry32(1225));

let dev = null;
if (DEV) {
  try {
    const m = await import('./dev/devHarness.js');
    dev = m.installDevHarness({
      enabled: true, renderer, scene, camera, controls,
      step, render, resize: resizeTo,
      state: () => ({ mood: S.mood, lights: S.lights, anim: S.anim, snow: S.snow, orns: S.orns.length, music: music.playing, agitation: +agitation.toFixed(3), resting: sRest.reduce((a, b) => a + b, 0), message: S.message }),
      input: { tap: (code) => { if (code === 'Space') shake(); }, down() {}, up() {} },
      extra: {
        S, tree, shake, tapAt, autoDecorate, setMessage, snowImpulse, saveImage, startMusic, stopMusic,
        setMood: (v) => { setGroup('mood', v); S.mood = v; applyMood(v); },
        setLights: (v, a) => { setGroup('lights', v); HANDLERS.lights(v); if (a) { setGroup('anim', a); S.anim = a; } },
        setSnow: (v) => { setGroup('snow', v); HANDLERS.snow(v); },
        tab: (name) => document.querySelector(`.tab[data-tab="${name}"]`)?.click(),
      },
    });
  } catch (e) { console.warn('dev/devHarness.js を読めませんでした', e); }
}

let last = performance.now();
const perf = { sum: 0, n: 0, skip: 60 };
function adaptQuality(rawDt) {
  if (dev || document.hidden || rawDt > 0.25) return;
  if (perf.skip > 0) { perf.skip--; return; }
  perf.sum += rawDt; perf.n++;
  if (perf.n < 90) return;
  const avg = perf.sum / perf.n; perf.sum = 0; perf.n = 0;
  const pr = renderer.getPixelRatio();
  if (avg > 1 / 40 && pr > 1) {
    renderer.setPixelRatio(Math.max(1, pr - 0.25));
    onResize(); perf.skip = 60;
  }
}
function frame(now) {
  const raw = (now - last) / 1000;
  const dt = Math.min(0.05, raw); last = now;
  adaptQuality(raw);
  if (!dev?.paused) step(dt);
  render();
  requestAnimationFrame(frame);
}
step(1 / 60); render();
const loadingEl = $('#loading');
if (DEV) loadingEl.remove(); else { loadingEl.classList.add('hide'); setTimeout(() => loadingEl.remove(), 900); }
if (!DEV) {
  setTimeout(() => { if (!hintShown) { hintShown = true; hintEl.classList.add('on'); setTimeout(hideHint, 6500); } }, 1200);
}
dev?.markReady();
requestAnimationFrame(frame);
</script>
</body>
